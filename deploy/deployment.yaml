apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-demo
  template:
    metadata:
      labels:
        app: hello-demo
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: hello-demo
          image: ghcr.io/ehalilovic700/hello-demo:5bc729d805c2453812d094d1dafe28ddbfeb7589
          ports:
            - containerPort: 8080
